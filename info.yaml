# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Sriram Vaibhav"      # Your name
  discord:      "vaibhav2648"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol emulator core for UART, SPI and I2C."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (protocol input pins, general purpose -- program-defined use)
  ui[0]: "pio_in0"
  ui[1]: "pio_in1"
  ui[2]: "pio_in2"
  ui[3]: "pio_in3"
  ui[4]: "pio_in4"
  ui[5]: "pio_in5"
  ui[6]: "pio_in6"
  ui[7]: "pio_in7"

  # Outputs (protocol output pins, push-pull, program-defined use)
  uo[0]: "pio_out0"
  uo[1]: "pio_out1"
  uo[2]: "pio_out2"
  uo[3]: "pio_out3"
  uo[4]: "pio_out4"
  uo[5]: "pio_out5"
  uo[6]: "pio_out6"
  uo[7]: "pio_out7"

  # Bidirectional pins: uio[0:2] load a program while cs_n is low;
  # uio[0:7] are open-drain capable general I/O once a program is running
  # (used for I2C SDA/SCL in the demo program, e.g. sda=uio[3] scl=uio[4])
  uio[0]: "load_sck"
  uio[1]: "load_mosi"
  uio[2]: "load_cs_n"
  uio[3]: "pio_io3"
  uio[4]: "pio_io4"
  uio[5]: "pio_io5"
  uio[6]: "pio_io6"
  uio[7]: "pio_io7"

# Do not change!
yaml_version: 6
